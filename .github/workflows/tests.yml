# Tests de l'API et compilation de l'interface, à chaque push et pull request
name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Tesseract : lecture des numéros de page ; interface compilée et navigateur : tests d'écran
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: cd frontend && npm ci && npx vite build
      - run: pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -q

  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pillow pillow-heif pypdfium2 httpx markdown numpy
      - run: cd sonde && python -m pytest -q tests

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npx vite build
